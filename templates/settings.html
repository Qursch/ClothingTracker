<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=480, height=800, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Settings</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}">
</head>
<body class="page-body settings-body">
  {% from '_nav.html' import nav_drawer %}
  {{ nav_drawer('settings') }}

  <header class="screen-header">
    <h1>Settings</h1>
  </header>

  <div class="settings-scroll">
    <section class="settings-section">
      <h2>Location</h2>
      <p class="settings-status" id="location-status">Loading…</p>
      <label class="field-label" for="latitude">Latitude</label>
      <input type="text" id="latitude" class="field-input" inputmode="decimal" autocomplete="off">
      <label class="field-label" for="longitude">Longitude</label>
      <input type="text" id="longitude" class="field-input" inputmode="decimal" autocomplete="off">
      <button type="button" class="action-btn action-btn-primary" id="save-location">Save Location</button>
    </section>

    <section class="settings-section">
      <h2>Bulk Import</h2>
      <p class="section-hint">Import a JSON file of items from the AI processing tool.</p>
      <label class="file-picker">
        <input type="file" id="import-file" accept=".json,application/json">
        <span class="file-picker-label" id="file-label">Choose JSON file…</span>
      </label>
      <button type="button" class="action-btn action-btn-primary" id="import-btn" disabled>Import Items</button>
      <p class="import-result" id="import-result" hidden></p>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
</body>
</html>
